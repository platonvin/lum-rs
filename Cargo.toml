cargo-features = ["profile-rustflags"]

[workspace]
    resolver = "2"
    members = [
        "lum",                # Include the lum crate
        "lumal",              # Include the lumal crate
        "shaders",
        "examples",           # example programs
        "as_u8_slice_derive",
        "unchecked_integer",  # derive macro for AsU8Slice
    ]

[profile.dev]
    opt-level = 0
    codegen-units = 16
    lto = "off"
    panic = "unwind"
    overflow-checks = true
    incremental = true
    debug = "line-directives-only"

[profile.release]
    opt-level = 3           # "s" is 5 times slower lol. TODO: investigate
    panic = "abort"
    codegen-units = 8
    lto = "thin"
    overflow-checks = false # TODO: unchecked math (UB on overflow)

# Highest possible optimizations
[profile.native]
    inherits = "release"
    opt-level = 3
    lto = "fat"
    codegen-units = 1
    debug = false
    panic = "abort"
    overflow-checks = false
    strip = "symbols"

# TODO: profile package?
[profile.distribution]
    inherits = "release"
    opt-level = 3
    lto = "fat"
    codegen-units = 1
    debug = false
    panic = "unwind"
    overflow-checks = true
