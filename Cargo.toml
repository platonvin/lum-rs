cargo-features = ["profile-rustflags"]

[workspace]
    resolver = "2"
    members = [
        "lum",                # Include the lum crate
        "lumal",              # Include the lumal crate
        "shaders",
        "examples",           # example programs
        "as_u8_slice_derive",
        "unchecked_integer",  # derive macro for AsU8Slice
    ]

[profile.dev]
    opt-level = 3
    codegen-units = 12
    lto = false
    panic = "unwind"
    overflow-checks = true
    incremental = true
    debug = true

[profile.dev.package.lum]
    opt-level = 0
[profile.dev.package.lumal]
    opt-level = 0
[profile.dev.package.examples]
    opt-level = 0

[profile.release]
    opt-level = 3           # "s" is 5 times slower lol. TODO: investigate
    panic = "abort"
    codegen-units = 8
    lto = false
    overflow-checks = false # TODO: unchecked math (UB on overflow)

[profile.nsight]
    inherits = "release"
    opt-level = 3           # "s" is 5 times slower lol. TODO: investigate
    panic = "unwind"
    codegen-units = 12
    lto = "off"
    overflow-checks = false # TODO: unchecked math (UB on overflow)
    debug = false

# Highest possible optimizations
[profile.native]
    inherits = "release"
    opt-level = 3
    codegen-units = 1
    lto = "fat"
    debug = false
    panic ="abort"
    overflow-checks = false
    strip = "symbols"

[profile.natsize]
    inherits = "release"
    opt-level = "s"
    lto = "fat"
    codegen-units = 1
    debug = false
    panic = "abort"
    overflow-checks = false
    strip = true

# TODO: profile package?
# TODO: multiverse cfg?
[profile.distribution]
    inherits = "release"
    opt-level = 3
    lto = "fat"
    codegen-units = 1
    debug = false
    panic = "unwind"
    overflow-checks = true
