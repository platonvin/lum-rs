[package]
name = "lum"
version = "0.1.4"
edition = "2021"

[features]
default = []
vk_backend = ["shaders/vk_backend"]
wgpu_backend = ["shaders/wgpu_backend"]
# controls wether Lum uses Lumal feature for validation layer names
debug_validation_names = ["lumal/debug_validation_names"]

[profile.dev]
# enable debug names for validation_layers use in Lum
features = ["debug_validation_names"]


[dependencies]
# lumal is lum's abstraction layer over vulkan
lumal = { path = "../lumal" }
shaders = { path = "../shaders" }
# derive macro for AsU8Slice
as_u8_slice_derive = { path = "../as_u8_slice_derive" }
winit = "0.30.9"
qvek = { git = "https://github.com/platonvin/qvek.git", branch = "master" }
pub-fields = "0.1.1"
block-mesh = "0.2.0"
flame = "0.2.2"
wgpu = "25.0.0"
futures = "0.3.31"

[lib]
name = "lum"
path = "src/lib.rs"

[dev-dependencies]
criterion = "0.5.1"
zarray = "1.3.0"
rayon = "1"

[[bench]]
name = "arrays"
harness = false

[[bench]]
name = "threads"
harness = false

[[bench]]
name = "radiance"
harness = false

[[bench]]
name = "hmap_vs_iter"
harness = false
