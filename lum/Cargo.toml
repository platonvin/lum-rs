[package]
name = "lum"
version = "0.1.4"
edition = "2021"

[dependencies]
lumal = { path = "../lumal" }  # Dependency on lumal crate (low-level Vulkan wrapper)
vulkanalia = { version = "0.25.0", features = ["libloading", "provisional", "window"] }
vulkanalia-vma = { version = "0.2.0" }
winit = "0.29"
euler = "0.4.1"
anyhow = "1"
glam = "0.29.2"

[lib]
name = "lum"
path = "src/lib.rs"  # Path to the library source file
