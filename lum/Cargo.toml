[package]
    name = "lum"
    version = "0.1.4"
    edition = "2021"

[features]
    default = []
    # controls wether Lum uses Lumal feature for validation layer names
    debug_validation_names = ["lumal/debug_validation_names"]
    
[profile.dev]
    # enable debug names for validation_layers use in Lum
    features = ["debug_validation_names"]

[dependencies]
    # lumal = { git = "https://github.com/platonvin/lumal-rs.git", rev = "4e11f82"} # lumal is lum's abstraction layer over vulkan
    shaders = { path = "../shaders" }
    lumal = { path = "../../lumal-rs" } # for development
    as_u8_slice_derive = { path = "../as_u8_slice_derive" } # derive macro for AsU8Slice, needed by Vulkanalia
    # unchecked_integer = { path = "../unchecked_integer" } # UB overflow ints
    vulkanalia = { version = "0.25.0", features = [
        "libloading",
        "provisional",
        "window",
    ] }
    vulkanalia-vma = { version = "0.2.0" }
    winit = "0.30.8"
    # anyhow = "1"
    vek = "0.17.1"
    pub-fields = "0.1.1"
    block-mesh = "0.2.0"
    flame = "0.2.2"

[lib]
    name = "lum"
    path = "src/lib.rs"

[dev-dependencies]
    criterion = "0.5.1"
    zarray = "1.3.0"
    rayon = "1"

[[bench]]
    name = "arrays"
    harness = false

[[bench]]
    name = "threads"
    harness = false

[[bench]]
    name = "radiance"
    harness = false