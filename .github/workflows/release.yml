name: Build & Release

on:
  release:
    types: [published]
  # do we need it?
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_release:
    permissions: write-all
    runs-on: ubuntu-latest
    # run when trigger is either a release event or manual dispatch
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Maybe useful update
        run: sudo apt update

      - name: get APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          # gcc for Windows cross-compile, glslc for shaders
          packages: mingw-w64 glslc
          execute_install_scripts: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
          rustflags: ""

      - name: Add Rust targets
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-gnu \
            wasm32-unknown-unknown

      - name: Build Linux Vulkan bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_vk \
            --features vk_backend \
            --target x86_64-unknown-linux-gnu

      - name: Build Windows Vulkan bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_vk \
            --features vk_backend \
            --target x86_64-pc-windows-gnu

      - name: Build Linux WGPU bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_wgpu \
            --features wgpu_backend \
            --target x86_64-unknown-linux-gnu

      - name: Build Windows WGPU bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_wgpu \
            --features wgpu_backend \
            --target x86_64-pc-windows-gnu

      - name: Build WASM lib
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_wgpu \
            --features wgpu_backend \
            --target wasm32-unknown-unknown

      - name: Determine upload URL
        id: get_upload_url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Fetching upload URL for the latest release..."
            UPLOAD_URL=$(
              gh release view --repo "${{ github.repository }}" \
                              --json uploadUrl \
                              --jq .uploadUrl
            )
            if [[ -z "$UPLOAD_URL" || "$UPLOAD_URL" == "null" ]]; then
              echo "Error: Could not find the latest release or its upload URL."
              exit 1
            fi
            echo "Found upload URL: $UPLOAD_URL"
            echo "url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi

      - name: Upload Linux Vulkan binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-unknown-linux-gnu/distribution/demo_vk
          asset_name: demo_vk-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows Vulkan binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-pc-windows-gnu/distribution/demo_vk.exe
          asset_name: demo_vk-windows.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload Linux WGPU binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-unknown-linux-gnu/distribution/demo_wgpu
          asset_name: demo_wgpu-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows WGPU binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-pc-windows-gnu/distribution/demo_wgpu.exe
          asset_name: demo_wgpu-windows.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload WASM blob
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/wasm32-unknown-unknown/distribution/demo_wgpu.wasm
          asset_name: demo_wgpu.wasm
          asset_content_type: application/wasm
