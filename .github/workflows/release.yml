name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  # do we need it?
  # workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    # only run on tag pushes or manual releases
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'release')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          # gcc for Windows cross-compile, glslc for shaders
          sudo apt install -y gcc-mingw-w64 glslc

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
          rustflags: ""

      - name: Add Rust targets
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-gnu \
            wasm32-unknown-unknown

      - name: Build Linux Vulkan bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_vk \
            --features vk_backend \
            --target x86_64-unknown-linux-gnu

      - name: Build Windows Vulkan bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_vk \
            --features vk_backend \
            --target x86_64-pc-windows-gnu

      - name: Build Linux WGPU bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_wgpu \
            --features wgpu_backend \
            --target x86_64-unknown-linux-gnu

      - name: Build Windows WGPU bin
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_wgpu \
            --features wgpu_backend \
            --target x86_64-pc-windows-gnu

      - name: Build WASM lib
        run: |
          cargo +nightly build \
            -Zbuild-std=std,panic_abort \
            --profile distribution \
            --package demo \
            --bin demo_wgpu \
            --features wgpu_backend \
            --target wasm32-unknown-unknown

      - name: Create GitHub Release
        if: github.event_name == 'push'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Automated release of **${{ github.ref_name }}**.
            Generated by CI on commit ${{ github.sha }}.
          draft: false
          prerelease: false

      - name: Determine upload URL
        id: get_upload_url
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "::set-output name=url::${{ github.event.release.upload_url }}"
          else
            echo "::set-output name=url::${{ steps.create_release.outputs.upload_url }}"
          fi

      - name: Upload Linux Vulkan binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-unknown-linux-gnu/distribution/demo_vk
          asset_name: demo_vk-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows Vulkan binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-pc-windows-gnu/distribution/demo_vk.exe
          asset_name: demo_vk-windows.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload Linux WGPU binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-unknown-linux-gnu/distribution/demo_wgpu
          asset_name: demo_wgpu-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows WGPU binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/x86_64-pc-windows-gnu/distribution/demo_wgpu.exe
          asset_name: demo_wgpu-windows.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload WASM blob
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_upload_url.outputs.url }}
          asset_path: target/wasm32-unknown-unknown/distribution/demo_wgpu.wasm
          asset_name: demo_wgpu.wasm
          asset_content_type: application/wasm
