[alias]     # command aliases
    c = "check"
    t = "test"
    b = "build"
    r = "run"
    br = "build --release"
    brr = "run --release" # yes one extra r.

[build]
    rustflags = [
        "-C", "target-feature=+mmx,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+cx16,+avx,+pclmul",     # TODO: how to do this in local build and what is local build?
        "-C", "link-arg=-fuse-ld=lld",   # Use LLVM's lld linker
        "-Z", "threads=8"              # Use multithreaded frontend during compilation. Or is it?
    ]

[env]
    RUST_BACKTRACE = "full" # this is what i love in Rust

[profile.native.build-override]
    rustflags = [
        "-C", "target-feature=+mmx,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+cx16,+avx,+pclmul",
        "-C", "link-arg=-fuse-ld=lld",   # Use LLVM's lld linker
        "-Z", "threads=8"              # Use multithreaded frontend during compilation. Or is it?
    ]
[profile.natsize.build-override]
    rustflags = [
        "-C", "target-feature=+mmx,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+cx16,+avx,+pclmul",
        "-C", "link-arg=-fuse-ld=lld",   # Use LLVM's lld linker
        "-Z", "threads=8"              # Use multithreaded frontend during compilation. Or is it?
    ]
