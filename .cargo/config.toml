[alias]
c = "check"
t = "test"
b = "build"
r = "run"

nv = "run --profile native --package examples --bin demo_vk --features vk_backend"
nw = "run --profile native --package examples --bin demo_wgpu --features wgpu_backend"
bnv = "build --profile native --package examples --bin demo_vk --features vk_backend"
bnw = "build --profile native --package examples --bin demo_wgpu --features wgpu_backend"

rv = "run --profile release --package examples --bin demo_vk --features vk_backend"
rw = "run --profile release --package examples --bin demo_wgpu --features wgpu_backend"
brv = "build --profile release --package examples --bin demo_vk --features vk_backend"
brw = "build --profile release --package examples --bin demo_wgpu --features wgpu_backend"

dv = "run --profile dev --package examples --bin demo_vk --features vk_backend"
dw = "run --profile dev --package examples --bin demo_wgpu --features wgpu_backend"
bdv = "build --profile dev --package examples --bin demo_vk --features vk_backend"
bdw = "build --profile dev --package examples --bin demo_wgpu --features wgpu_backend"

[build]
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[env]
RUST_BACKTRACE = "short" # this is what i love in Rust

# native is highest perfomance build
[profile.native.build-override]
rustflags = [
    "-C",
    "target-cpu=native",
    # TODO: find better passes for Lum 
    # "-C",
    # "passes= adce loop-unroll simplifycfg gvn sroa tailcallelim early-cse",
]

# natsize is smallest build
[profile.natsize.build-override]
rustflags = [
    "-C",
    "target-cpu=native",
    "-Zlocation-detail=none",
    "-Zfmt-debug=none",
]

[unstable]
codegen-backend = true

# dev is a normal debug build, almost unused
# rv/rw are (Release Vulkan/Wgpu), they are just "debug but fast" and separate for convinience
# [profile.dev]
# codegen-backend = "cranelift"
