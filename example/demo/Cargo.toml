[package]
name = "demo"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["webgpu"]
wgpu_backend = ["lum/wgpu_backend"]
webgpu = ["wgpu/default"]
vk_backend = ["lum/vk_backend"]

[dependencies]
lum = { path = "../../lum" }
shaders = { path = "../../shaders" }
assets = { path = "../assets" }
winit = "0.30.11"


# [target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0.5", default-features = false }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["Document", "Window", "Element"] }
wasm-bindgen-futures = "0.4.50"
bytemuck = { version = "1.23.1", features = ["derive"] }
egui = "0.31.1"
egui-wgpu = { version = "0.31.1", features = ["winit"] }
futures = "0.3.31"
log = "0.4.27"
nalgebra-glm = { version = "0.19.0", features = [
    "convert-bytemuck",
    "serde-serialize",
] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
egui-winit = "0.31.1"
pollster = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
egui-winit = { version = "0.31.1", default-features = false }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

# [[bin]]
# path = "src/bin/demo_vk.rs"
# name = "demo_vk"

# [[bin]]
# path = "src/bin/demo_wgpu.rs"
# name = "demo_wgpu"

[lib]
# we want to build for web, too
crate-type = ["cdylib", "rlib"]
path = "src/demo_lib.rs"
name = "demo_lib"
